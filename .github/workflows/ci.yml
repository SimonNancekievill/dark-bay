name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dark-bay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dark-bay"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/dark-bay
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
