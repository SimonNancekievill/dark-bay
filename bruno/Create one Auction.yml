info:
  name: Create one Auction
  type: http
  seq: 1

http:
  method: POST
  url: '{{baseURL}}/auctions'
  body:
    type: json
    data: |2-
        {
          "title": "Antique Persian Rug",
          "description": "Hand-woven wool rug, approx. 200x300cm, early 20th century.",
          "startingPrice": 1200,
          "endDate": "2026-09-05T14:00:00.000Z",
          "seller": "rugtraderemma"
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
